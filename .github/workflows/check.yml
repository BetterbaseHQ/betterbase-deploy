name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config >/dev/null

  caddy:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Caddyfile
        run: |
          docker build -t caddy-check ./caddy
          docker run --rm caddy-check caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Shellcheck setup.sh
        run: shellcheck --severity=warning setup.sh
