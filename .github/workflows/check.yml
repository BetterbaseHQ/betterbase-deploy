name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config >/dev/null

  caddy:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Caddyfile
        run: |
          docker build -t caddy-check ./caddy
          # The Caddyfile is bind-mounted at runtime, so validate it as a mount
          # Localhost mode (env unset -> port-form site addresses)
          docker run --rm \
            -v "${PWD}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy-check caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          # Domain mode (hostname site addresses -> automatic HTTPS on 443)
          docker run --rm \
            -v "${PWD}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e ACCOUNTS_SITE=accounts.example.com \
            -e SYNC_SITE=sync.example.com \
            -e ACME_EMAIL=admin@example.com \
            caddy-check caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Shellcheck setup.sh
        run: shellcheck --severity=warning setup.sh
